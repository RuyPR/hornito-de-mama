<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sorteo dominguero · El Hornito de Mamá</title>
<style>
:root{
  --pink:#f8d9df;--red:#c92f52;--red2:#9f1e3c;
  --wine:#67121e;--cream:#fffaf2;--ink:#32171b;--gold:#f4b83f
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  font-family:Arial,Helvetica,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 20% 10%,#fff 0 7%,transparent 8%),
             linear-gradient(135deg,#f7cbd4,#fff3f1 55%,#f5d6dd);
}
.card{
  width:min(1240px,94vw);height:min(700px,92vh);background:rgba(255,250,242,.98);
  border:4px solid var(--red);border-radius:30px;padding:24px;
  box-shadow:0 20px 55px rgba(103,18,30,.2);text-align:center;
  position:relative;overflow:hidden
}
.header{display:flex;align-items:center;justify-content:center;gap:16px;position:relative;grid-column:1/-1}
.logo{width:82px;height:82px;object-fit:contain;flex:none;background:transparent}
.header-text{text-align:left}
.brand{letter-spacing:2px;text-transform:uppercase;font-weight:900;color:var(--red);font-size:13px}
h1{margin:1px 0 0;font-size:clamp(30px,4vw,48px);color:var(--wine)}
.subtitle{font-size:16px;margin:3px auto 9px}
.badge{display:inline-block;background:var(--red);color:#fff;padding:7px 15px;border-radius:999px;font-weight:900;font-size:14px}
.wheel-area{position:relative;width:min(690px,76vw);margin:18px auto 8px}
canvas{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 14px rgba(80,20,30,.18))}
.pointer{
  position:absolute;z-index:5;top:-5px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;
  border-top:42px solid var(--wine);border-bottom:0;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))
}
.pointer:after{
  content:"";position:absolute;left:-8px;top:-38px;width:16px;height:16px;
  border-radius:50%;background:var(--gold);border:3px solid #fff
}
#spin{
  border:0;background:var(--red);color:#fff;font-size:20px;font-weight:900;
  padding:15px 32px;border-radius:999px;cursor:pointer;
  box-shadow:0 7px 0 var(--red2);transition:.12s transform
}
#spin:active{transform:translateY(5px);box-shadow:0 2px 0 var(--red2)}
#spin:disabled{opacity:.65;cursor:not-allowed;box-shadow:none}
.status{min-height:28px;margin:14px 0 4px;color:#7d3a45;font-weight:800}
.winners{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.winner{
  background:#fff;border:3px dashed #e26a83;border-radius:18px;
  padding:14px 22px;min-width:190px;animation:pop .45s ease both
}
.winner small{display:block;color:#a34b5d;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.winner strong{display:block;font-size:24px;color:var(--wine);margin-top:4px}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}


.wheel-column{
  grid-column:1;grid-row:2;min-width:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;height:100%;
}
.side-column{
  grid-column:2;grid-row:2;height:100%;display:flex;flex-direction:column;
  align-items:stretch;justify-content:center;min-width:0;
  padding:10px 4px;
}
.side-title{font-size:19px;font-weight:900;color:var(--wine);margin-bottom:7px}
.side-column .status{min-height:48px;margin:4px 0 8px}
.side-column .winners{display:flex;flex-direction:column;gap:12px;margin:4px 0 18px}
.side-column .winner{width:100%;min-width:0;padding:16px 14px}
.side-column #spin{width:100%;margin-top:auto}
.side-column .editor{margin-top:12px}

.editor{max-width:760px;margin:7px auto 0;background:transparent;border:0;border-radius:12px;padding:0;text-align:center}
.editor summary{
  list-style:none;cursor:pointer;color:#a55a68;font-size:14px;font-weight:900;
  width:30px;height:30px;line-height:30px;margin:0 0 0 auto;border-radius:50%;
  opacity:.45;transition:.15s
}
.editor summary::-webkit-details-marker{display:none}
.editor summary:hover{opacity:1;background:#fff0f3}
.editor[open] summary{opacity:1;background:#fff0f3}
.editor-content{
  margin-top:8px;background:#fff4f5;border:2px solid #efb3c0;
  border-radius:18px;padding:14px;text-align:left
}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.settings-grid label,.participant-label{display:flex;flex-direction:column;gap:5px}
.settings-grid .full{grid-column:1/-1}
.settings-grid span,.participant-label>span{font-size:12px;color:#8b4d5b;font-weight:900}
.settings-grid input{
  width:100%;padding:10px 11px;border:2px solid #e8a9b7;border-radius:10px;
  background:#fff;color:var(--ink);font:15px Arial
}
.participant-label{margin-top:10px}
textarea{
  width:100%;min-height:105px;resize:vertical;padding:10px;border:2px solid #e8a9b7;
  border-radius:10px;background:#fff;color:var(--ink);font:14px Arial
}
.editor-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;justify-content:center}
.editor button{border:0;border-radius:999px;padding:9px 15px;font-weight:800;cursor:pointer}
#applySettings{background:var(--red);color:#fff}
#resetNames{background:#fff;color:var(--red);border:2px solid var(--red)}
.help{font-size:11px;color:#8c6670;margin:7px 0 0;text-align:center}
@media(max-width:800px){
  .card{height:auto;min-height:96vh;display:block}
  .header{gap:8px}
  .logo{width:72px;height:72px}
  .header-text{text-align:center}
  .wheel-column{display:flex}
  .side-column{display:flex;margin-top:8px}
  .settings-grid{grid-template-columns:1fr}
  .settings-grid .full{grid-column:auto}
  .wheel-area{width:min(92vw,590px)}
  .side-column .winners{flex-direction:row}
}

@media(max-width:800px){
  .card{padding:18px 12px}
  .header{gap:8px}
  .logo{width:72px;height:72px}
  .header-text{text-align:center}
  .wheel-area{width:92vw}
}

/* ===== LAPTOP HORIZONTAL LAYOUT ===== */
html,body{width:100%;height:100%;overflow:hidden}
body{min-height:100vh}

.card{
  width:min(1240px,96vw);
  height:min(700px,94vh);
  min-height:600px;
  padding:18px 22px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  grid-template-rows:92px minmax(0,1fr);
  column-gap:24px;
  row-gap:4px;
  align-items:stretch;
}

.header{
  grid-column:1 / -1;
  grid-row:1;
  min-height:0;
  gap:13px;
  justify-content:flex-start;
  padding:0 10px;
}
.logo{width:72px;height:72px}
.header-text{min-width:0}
.brand{font-size:12px}
h1{font-size:40px;line-height:1}
.subtitle{font-size:15px;margin:4px 0 0}

.wheel-column{
  grid-column:1;
  grid-row:2;
  min-width:0;
  min-height:0;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.wheel-column .badge{margin-bottom:3px;padding:6px 14px;font-size:13px}
.wheel-area{
  width:min(560px,100%);
  max-height:calc(100% - 28px);
  aspect-ratio:1;
  margin:0 auto;
}
.wheel-area canvas{width:100%;height:100%}

.side-column{
  grid-column:2;
  grid-row:2;
  min-width:0;
  min-height:0;
  height:100%;
  padding:8px 2px;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:flex-start;
  border-left:2px dashed #efb3c0;
  padding-left:22px;
}
.side-title{
  font-size:18px;
  margin:2px 0 8px;
  text-align:left;
}
.side-column .status{
  min-height:42px;
  margin:0 0 8px;
  padding:10px 12px;
  background:#fff4f5;
  border-radius:12px;
  text-align:center;
}
.side-column .winners{
  display:flex;
  flex-direction:column;
  flex-wrap:nowrap;
  gap:10px;
  margin:4px 0 12px;
}
.side-column .winner{
  width:100%;
  min-width:0;
  padding:13px 12px;
  text-align:center;
}
.side-column .winner strong{font-size:22px}
.side-column #spin{
  width:100%;
  margin:6px 0 0;
  flex:0 0 auto;
  padding:14px 12px;
  font-size:18px;
}
.side-column .editor{
  width:100%;
  max-width:none;
  margin:10px 0 0;
}
.side-column .editor summary{
  margin-left:auto;
  margin-right:0;
}

/* Keep configuration closed and unobtrusive during the recording. */
.editor-content{max-height:310px;overflow:auto}

@media (min-width:1000px) and (max-height:780px){
  .card{
    height:calc(100vh - 24px);
    min-height:0;
    padding:14px 18px;
    grid-template-rows:82px minmax(0,1fr);
  }
  .logo{width:64px;height:64px}
  h1{font-size:36px}
  .subtitle{font-size:14px}
  .side-column{padding-top:4px;padding-left:18px}
  .side-title{font-size:17px}
  .side-column .winner{padding:10px}
  .side-column .winner strong{font-size:20px}
  .side-column #spin{padding:12px;font-size:17px}
}

/* Only switch to a stacked/mobile presentation on genuinely narrow screens. */
@media (max-width:900px){
  html,body{overflow:auto}
  .card{
    width:94vw;
    height:auto;
    min-height:96vh;
    display:block;
    padding:18px 12px;
  }
  .header{justify-content:center;padding:0}
  .header-text{text-align:center}
  .wheel-column{display:flex;height:auto}
  .wheel-area{width:min(92vw,590px);max-height:none}
  .side-column{
    display:flex;
    height:auto;
    border-left:0;
    border-top:2px dashed #efb3c0;
    padding:16px 0 0;
    margin-top:12px;
  }
}


/* 16-inch laptop desktop profile */
@media (min-width:901px){
  html,body{width:100%;height:100%;overflow:hidden}
  .card{
    width:min(1320px,94vw);
    height:min(690px,91vh);
    min-height:0;
    padding:16px 22px;
    grid-template-columns:minmax(0,1fr) 350px;
    grid-template-rows:84px minmax(0,1fr);
    column-gap:24px;
  }
  .wheel-area{width:min(590px,100%);max-height:calc(100% - 26px)}
  .logo{width:68px;height:68px}
  h1{font-size:38px}
  .subtitle{font-size:15px}
  .side-column{padding-left:22px}
}

</style>

const prize2Input = document.getElementById("prize2Input");

let participants = [...DEFAULT_PARTICIPANTS];

let angle = 0;
let spinning = false;
let winnerNumber = 0;
let pendingWinnerIndex = null;
let phase = "first"; // first | waitingSecond | second | finished

function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function secureRandomInt(max){
  const buf = new Uint32Array(1);
  const range = 0x100000000;
  const limit = range - (range % max);
  let x;
  do { crypto.getRandomValues(buf); x = buf[0]; } while(x >= limit);
  return x % max;
}

function updateUI(){
  badgeEl.textContent = `${participants.length} participantes · 2 ganadores`;
  participantInput.value = participants.join("\n");
  titleInput.value = config.title;
subtitleInput.value = config.subtitle.replace(/<[^>]*>/g, "");
  prize1Input.value = config.prize1;
  prize2Input.value = config.prize2;
  document.getElementById("eventTitle").textContent = config.title;
  document.getElementById("eventSubtitle").innerHTML = config.subtitle;
}

function drawWheel(){
  const cx=canvas.width/2, cy=canvas.height/2, r=canvas.width*0.44;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.beginPath();ctx.arc(cx,cy,r+18,0,Math.PI*2);
  ctx.fillStyle="#fff8ed";ctx.fill();
  ctx.lineWidth=8;ctx.strokeStyle="#c92f52";ctx.stroke();

  if(pool.length===0) return;

  const slice=Math.PI*2/pool.length;

  // El tamaño de texto se adapta al número de participantes.
  const fontSize = Math.max(9, Math.min(21, 245 / Math.sqrt(pool.length)));

  for(let i=0;i<pool.length;i++){
    const a0=angle+i*slice, a1=a0+slice;

    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a0,a1);ctx.closePath();
    ctx.fillStyle=colors[i%colors.length];ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle="#fff7ef";ctx.stroke();

    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(a0+slice/2);
    ctx.textAlign="right";ctx.textBaseline="middle";
    ctx.font=`900 ${fontSize}px Arial`;

    // Ajuste dinámico del nombre para que quepa dentro del segmento.
    let label=pool[i];
    const maxChars = pool.length > 35 ? 10 : pool.length > 25 ? 13 : pool.length > 18 ? 17 : 22;
    if(label.length>maxChars) label=label.slice(0,maxChars-1)+"…";

    ctx.fillStyle=(i%colors.length===1||i%colors.length===3)?"#4b171f":"#fff";
    ctx.fillText(label,r-18,0);
    ctx.restore();
  }

  ctx.beginPath();ctx.arc(cx,cy,34,0,Math.PI*2);
  ctx.fillStyle="#fff8ed";ctx.fill();
  ctx.lineWidth=6;ctx.strokeStyle="#c92f52";ctx.stroke();
  ctx.font="28px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("",cx,cy);
}

function easeOutCubic(t){return 1-Math.pow(1-t,3)}

function resetSorteo(){
  pool = [...participants];
  angle = 0;
  winnerNumber = 0;
  pendingWinnerIndex = null;
  phase = "first";
  winnersEl.innerHTML = "";
  statusEl.textContent = "Presiona el botón para comenzar.";
  spinBtn.disabled = false;
  spinBtn.textContent = " GIRAR LA RULETA";
  drawWheel();
}

function spin(){
  if(spinning || pool.length===0) return;

  // Primer ganador permanece visible hasta que se pulse nuevamente.
  if(phase === "waitingSecond"){
    if(pendingWinnerIndex !== null){
      pool.splice(pendingWinnerIndex,1);
      pendingWinnerIndex=null;
    }
    phase="second";
    drawWheel();
  } else if(phase === "finished"){
    // No existe tercer ganador: el siguiente clic reinicia el ciclo.
    resetSorteo();
  }

  spinning=true;
  spinBtn.disabled=true;
  statusEl.textContent = winnerNumber===0
    ? "La ruleta está girando…"
    : "Vamos por el segundo ganador…";

  const selected=secureRandomInt(pool.length);
  const slice=Math.PI*2/pool.length;

  // El puntero está arriba y apunta hacia abajo, al segmento situado a -PI/2.
  const targetCenter=selected*slice+slice/2;
  const pointerAngle=-Math.PI/2;
  const currentNorm=((angle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  const desiredNorm=pointerAngle-targetCenter;
  let delta=((desiredNorm-currentNorm)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
  delta+=(6+secureRandomInt(3))*Math.PI*2;

  const start=angle,end=angle+delta,duration=5200,t0=performance.now();

  function frame(now){
    const p=Math.min(1,(now-t0)/duration);
    angle=start+(end-start)*easeOutCubic(p);
    drawWheel();

    if(p<1) requestAnimationFrame(frame);
    else{
      angle=end;
      const winner=pool[selected];

      // IMPORTANTE: el nombre ganador NO se elimina todavía.
      // Se mantiene en el tablero hasta el próximo clic.
      pendingWinnerIndex=selected;
      winnerNumber++;

      showWinner(winner);
      spinning=false;
      drawWheel();

      if(winnerNumber===1){
        phase="waitingSecond";
        spinBtn.disabled=false;
        spinBtn.textContent=" GIRAR PARA EL 2.º GANADOR";
      }else{
        phase="finished";
        spinBtn.disabled=false;
        spinBtn.textContent=" GIRAR PARA EL 1.er GANADOR";
      }
    }
  }
  requestAnimationFrame(frame);
}

function showWinner(name){
  statusEl.textContent=winnerNumber===1
    ? "Primer ganador! La ruleta queda detenida en su nombre."
    : "Segundo ganador! Sorteo completado.";

  winnersEl.insertAdjacentHTML("beforeend",
    `<div class="winner"><small>Ganador ${winnerNumber}</small><strong>${escapeHtml(name)}</strong><div>${winnerNumber===1 ? config.prize1 : config.prize2}</div></div>`
  );
}

function applySettings(){
  if(spinning) return;

  const newList = participantInput.value
    .split("\n")
    .map(n=>n.trim())
    .filter(Boolean);

  const unique = [...new Set(newList)];

  if(unique.length < 2){
    alert("Debes tener al menos 2 participantes.");
    return;
  }

  participants = unique;
const newTitle = titleInput.value.trim() || "Sorteo";
  const newSubtitle = subtitleInput.value.trim() || "¡Sorteamos premios entre los participantes!";
  const newPrize1 = prize1Input.value.trim() || "1 porción de keke de piña";
  const newPrize2 = prize2Input.value.trim() || "1 porción de keke de piña";
  const safeSubtitle = escapeHtml(newSubtitle);
  const safePrize1 = escapeHtml(newPrize1);
  const safePrize2 = escapeHtml(newPrize2);

  config = {
    title: newTitle,
    subtitle: safeSubtitle,
    prize1: safePrize1,
    prize2: safePrize2
  };

  resetSorteo();
  updateUI();
  statusEl.textContent = ` Configuración actualizada: ${participants.length} participantes.`;
}

applySettingsBtn.addEventListener("click",applySettings);
resetNamesBtn.addEventListener("click",()=>{
  if(spinning) return;
  participants=[...DEFAULT_PARTICIPANTS];
  config={...DEFAULT_CONFIG};
  resetSorteo();
  updateUI();
  statusEl.textContent=" Valores iniciales restaurados.";
});
spinBtn.addEventListener("click",spin);

updateUI();
drawWheel();
</script>
